name: E2E Tests

on:
    push:
        branches: [main, master, develop]
    pull_request:
        branches: [main, master, develop]

jobs:
    test:
        timeout-minutes: 60
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write

        strategy:
            fail-fast: false
            matrix:
                php: ['8.3', '8.4']
                wordpress: ['6.8', '6.9', 'latest']

        name: Test PHP ${{ matrix.php }} / WP ${{ matrix.wordpress }}

        env:
            WP_PLAYGROUND_PORT: 9400

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Install dependencies
              run: npm i

            - name: Build plugin
              run: npm run build

            - name: Install Playwright browsers
              run: npx playwright install --with-deps chromium

            - name: Start WordPress Playground
              run: |
                  npx @wp-playground/cli@3.1.59 server \
                    --blueprint=blueprint.json \
                    --php=${{ matrix.php }} \
                    --wp=${{ matrix.wordpress }} \
                    --port=$WP_PLAYGROUND_PORT \
                    --verbosity=debug \
                    --auto-mount > "$RUNNER_TEMP/playground.log" 2>&1 &
                  echo "PLAYGROUND_PID=$!" >> $GITHUB_ENV
              env:
                  CI: true

            - name: Wait for WordPress Playground to be ready
              run: |
                  fail() {
                    echo "::error::WordPress Playground $1"
                    if kill -0 "$PLAYGROUND_PID" 2>/dev/null; then
                      echo "Process $PLAYGROUND_PID is still running."
                    else
                      echo "Process $PLAYGROUND_PID has exited."
                    fi
                    tail -n 100 "$RUNNER_TEMP/playground.log"
                    exit 1
                  }
                  deadline=$((SECONDS + 120))
                  until curl -sSf --max-time 5 "http://127.0.0.1:$WP_PLAYGROUND_PORT" > /dev/null 2>&1; do
                    kill -0 "$PLAYGROUND_PID" 2>/dev/null || fail "exited before it was ready."
                    [ "$SECONDS" -lt "$deadline" ] || fail "was not ready after 120 seconds."
                    sleep 2
                  done
                  sleep 5

            - name: Run Playwright tests
              id: tests
              continue-on-error: true
              run: npm run test:e2e
              env:
                  CI: true
                  WP_BASE_URL: http://127.0.0.1:9400

            - name: Stop WordPress Playground
              if: always()
              run: |
                  if [ -n "$PLAYGROUND_PID" ]; then
                    kill $PLAYGROUND_PID || true
                  fi

            - name: Upload WordPress Playground log
              uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: playground-log-php${{ matrix.php }}-wp${{ matrix.wordpress }}
                  path: ${{ runner.temp }}/playground.log
                  retention-days: 30
                  if-no-files-found: ignore

            - name: Upload test results
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: playwright-report-php${{ matrix.php }}-wp${{ matrix.wordpress }}
                  path: test-results/
                  retention-days: 30
                  if-no-files-found: ignore

            - name: Comment PR with test results
              uses: daun/playwright-report-comment@v3
              if: always() && github.event_name == 'pull_request'
              with:
                  report-file: test-results/results.json

            - name: Fail if tests failed
              if: steps.tests.outcome == 'failure'
              run: exit 1
